<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - Tính điểm học phần</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng FontAwesome icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding-top: 90px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            max-width: 520px;
            margin: 0 auto;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            overflow: hidden;
        }
        .card-header-custom {
            background: var(--primary-gradient);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .form-control-lg {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .form-control-lg:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }
        .input-group-text {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-right: none;
            border-radius: 12px 0 0 12px;
            color: #64748b;
        }
        .input-group .form-control-lg {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }
        .btn-custom {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-custom:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .alert-custom {
            border-radius: 14px;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Include Navbar chung -->
    {% include 'navbar.html' %}

    <div class="container py-4">
        <div class="card card-custom">
            <!-- Header màu xanh lá hiện đại -->
            <div class="card-header-custom">
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-graduation-cap me-2"></i>Tính Điểm Học Phần</h3>
                <p class="mb-0 text-white-50 small">Trọng số: Chuyên cần (10%) • Giữa kỳ (30%) • Cuối kỳ (60%)</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('bai2') }}" method="POST" novalidate>
                    <!-- Điểm chuyên cần (10%) -->
                    <div class="mb-3">
                        <label for="cc" class="form-label fw-semibold text-secondary">Chuyên cần (10%)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user-check"></i></span>
                            <input 
                                type="text" 
                                class="form-control form-control-lg" 
                                id="cc" 
                                name="cc" 
                                placeholder="Ví dụ: 8,5 hoặc 8.5" 
                                value="{{ cc }}"
                            >
                        </div>
                    </div>

                    <!-- Điểm giữa kỳ (30%) -->
                    <div class="mb-3">
                        <label for="gk" class="form-label fw-semibold text-secondary">Giữa kỳ (30%)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-book-open"></i></span>
                            <input 
                                type="text" 
                                class="form-control form-control-lg" 
                                id="gk" 
                                name="gk" 
                                placeholder="Ví dụ: 7,5 hoặc 7.5" 
                                value="{{ gk }}"
                            >
                        </div>
                    </div>

                    <!-- Điểm cuối kỳ (60%) -->
                    <div class="mb-4">
                        <label for="ck" class="form-label fw-semibold text-secondary">Cuối kỳ (60%)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-file-lines"></i></span>
                            <input 
                                type="text" 
                                class="form-control form-control-lg" 
                                id="ck" 
                                name="ck" 
                                placeholder="Ví dụ: 6,0 hoặc 6.0" 
                                value="{{ ck }}"
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom w-100 fw-bold shadow-sm">
                        <i class="fa-solid fa-calculator me-2"></i>Tính Điểm Học Phần
                    </button>
                </form>

                <!-- Hiển thị kết quả -->
                {% if diem_hp is not none %}
                    <hr class="my-4 text-muted opacity-25">
                    <div class="alert alert-success alert-custom text-center shadow-sm p-4 mb-0" role="alert">
                        <h4 class="alert-heading fw-bold mb-2">
                            <i class="fa-solid fa-award me-1"></i> Kết quả học tập
                        </h4>
                        <p class="fs-5 mb-1">Điểm tổng kết: <strong class="text-success">{{ diem_hp }}</strong></p>
                        <p class="fs-5 mb-0">Điểm chữ: <strong class="badge bg-success fs-5 px-3 py-1">{{ diem_chu }}</strong></p>
                    </div>
                {% endif %}

                <!-- Hiển thị lỗi chung -->
                {% if error %}
                    <hr class="my-4 text-muted opacity-25">
                    <div class="alert alert-danger alert-custom text-center shadow-sm p-3 mb-0" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

</body>
</html>
