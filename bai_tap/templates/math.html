<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhập 2 số a và b - HTML & CSS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      padding: 20px;
    }

    /* Thẻ Card hiệu ứng Kính mờ */
    .calc-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-top: 6px;
    }

    /* Vùng chứa các ô Input */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-wrapper label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #cbd5e1;
    }

    /* Style cho Ô Input đẹp mắt */
    .styled-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #38bdf8;
      font-size: 1.25rem;
      font-weight: 700;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .input-wrapper.val-b .styled-input {
      color: #f43f5e;
    }

    .styled-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.2);
      background: rgba(15, 23, 42, 0.8);
    }

    .styled-input::placeholder {
      color: #475569;
      font-weight: 400;
      font-size: 1rem;
    }

    /* Nút bấm (Giao diện HTML thuần) */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
      margin-bottom: 24px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(168, 85, 247, 0.5);
    }

    /* Bảng kết quả */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
    }

    .op-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      color: #e2e8f0;
      font-size: 0.95rem;
    }

    .op-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .add .op-badge { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .sub .op-badge { background: rgba(244, 63, 94, 0.2); color: #f43f5e; }
    .mul .op-badge { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .div .op-badge { background: rgba(52, 211, 153, 0.2); color: #34d399; }

    .op-res {
      font-size: 1.2rem;
      font-weight: 700;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="calc-card">
    <div class="header">
      <h1>Tính Toán Số A & B</h1>
      <p>Giao diện nhập dữ liệu HTML & CSS</p>
    </div>

    <!-- Khung Nhập 2 Số A và B -->
    <form class="form-group" method="post" type="submit">
      <div class="input-wrapper">
        <label for="num-a">Nhập Số A</label>
        <input type="number" name="a" id="num-a" class="styled-input" placeholder="Ví dụ: 10" value="{{a}}">
      </div>

      <div class="input-wrapper val-b">
        <label for="num-b">Nhập Số B</label>
        <input type="number" name="b" id="num-b" class="styled-input" placeholder="Ví dụ: 5" value="{{b}}">
      </div>

      <button type="submit" class="btn-submit">Tính Kết Quả</button>
    </form>

    <!-- Khung Bảng Kết Quả -->
    <div class="results-list">
      <div class="result-item add">
        <span class="op-name">
          <span class="op-badge">+</span> Phép cộng ({{a}} + {{b}})
        </span>
        <span class="op-res">{{cong}}</span>
      </div>

      <div class="result-item sub">
        <span class="op-name">
          <span class="op-badge">−</span> Phép trừ (a − b)
        </span>
        <span class="op-res">{{tru}}</span>
      </div>

      <div class="result-item mul">
        <span class="op-name">
          <span class="op-badge">×</span> Phép nhân (a × b)
        </span>
        <span class="op-res">{{nhan}}</span>
      </div>

      <div class="result-item div">
        <span class="op-name">
          <span class="op-badge">÷</span> Phép chia (a ÷ b)
        </span>
        <span class="op-res">{{chia}}</span>
      </div>
    </div>
  </div>

</body>
</html>
